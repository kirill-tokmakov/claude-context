name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:core && pnpm build:mcp
      - run: pnpm --filter @kirill-tokmakov/claude-context-core test
      - run: pnpm --filter @kirill-tokmakov/claude-context-core test:fortran
      - run: pnpm --filter @kirill-tokmakov/claude-context-mcp test
      - name: Publish core
        run: pnpm --filter @kirill-tokmakov/claude-context-core publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish MCP
        run: pnpm --filter @kirill-tokmakov/claude-context-mcp publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
